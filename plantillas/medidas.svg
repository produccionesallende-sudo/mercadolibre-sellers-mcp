<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="sans-serif">
  <!-- Plantilla: medidas. Campos: {{TITULO}}, {{ALTO}}, {{ANCHO}}, {{PROFUNDIDAD}}, {{PESO}}. Foto al centro con flechas de cota. -->
  <defs>
    <marker id="flecha-fin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2a41"/>
    </marker>
  </defs>

  <rect width="1200" height="1200" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="18" fill="#1b2a41"/>

  <!-- Título -->
  <text x="600" y="130" font-size="54" font-weight="800" fill="#1b2a41" text-anchor="middle">{{TITULO}}</text>
  <text x="600" y="178" font-size="28" font-weight="600" fill="#5f6977" text-anchor="middle" letter-spacing="3">MEDIDAS</text>

  <!-- Marco de la foto (centro) -->
  <rect x="300" y="260" width="600" height="600" rx="24" fill="#f3f5f7" stroke="#d9dfe6" stroke-width="3"/>
  <image id="foto" x="330" y="290" width="540" height="540" href="" preserveAspectRatio="xMidYMid meet"/>

  <!-- Cota vertical (ALTO), a la izquierda -->
  <line x1="200" y1="260" x2="200" y2="860" stroke="#1b2a41" stroke-width="5" marker-start="url(#flecha-fin)" marker-end="url(#flecha-fin)"/>
  <line x1="190" y1="260" x2="296" y2="260" stroke="#c3cad3" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="190" y1="860" x2="296" y2="860" stroke="#c3cad3" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="100" y="520" width="200" height="80" rx="12" fill="#ffffff"/>
  <text x="200" y="548" font-size="22" font-weight="600" fill="#5f6977" text-anchor="middle">ALTO</text>
  <text x="200" y="590" font-size="36" font-weight="800" fill="#1b2a41" text-anchor="middle">{{ALTO}}</text>

  <!-- Cota horizontal (ANCHO), abajo -->
  <line x1="300" y1="940" x2="900" y2="940" stroke="#1b2a41" stroke-width="5" marker-start="url(#flecha-fin)" marker-end="url(#flecha-fin)"/>
  <line x1="300" y1="864" x2="300" y2="950" stroke="#c3cad3" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="900" y1="864" x2="900" y2="950" stroke="#c3cad3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="990" font-size="22" font-weight="600" fill="#5f6977" text-anchor="middle">ANCHO</text>
  <text x="600" y="1032" font-size="36" font-weight="800" fill="#1b2a41" text-anchor="middle">{{ANCHO}}</text>

  <!-- Cota de profundidad, a la derecha (diagonal corta) -->
  <line x1="960" y1="330" x2="1080" y2="250" stroke="#1b2a41" stroke-width="5" marker-start="url(#flecha-fin)" marker-end="url(#flecha-fin)"/>
  <line x1="904" y1="330" x2="964" y2="330" stroke="#c3cad3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1030" y="390" font-size="22" font-weight="600" fill="#5f6977" text-anchor="middle">PROFUNDIDAD</text>
  <text x="1030" y="432" font-size="36" font-weight="800" fill="#1b2a41" text-anchor="middle">{{PROFUNDIDAD}}</text>

  <!-- Peso, a la derecha abajo -->
  <rect x="930" y="700" width="210" height="130" rx="16" fill="#f3f5f7" stroke="#d9dfe6" stroke-width="3"/>
  <text x="1035" y="748" font-size="22" font-weight="600" fill="#5f6977" text-anchor="middle">PESO</text>
  <text x="1035" y="800" font-size="36" font-weight="800" fill="#1b2a41" text-anchor="middle">{{PESO}}</text>

  <!-- Aclaración -->
  <text x="600" y="1120" font-size="24" font-weight="500" fill="#5f6977" text-anchor="middle">Medidas aproximadas. Pueden variar levemente.</text>

  <rect x="0" y="1182" width="1200" height="18" fill="#1b2a41"/>
</svg>
